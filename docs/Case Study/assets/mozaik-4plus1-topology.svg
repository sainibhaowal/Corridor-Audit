<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" width="1200" height="570" font-family="Inter, Segoe UI, system-ui, sans-serif">
  <rect width="1200" height="570" rx="20" fill="#080d12" stroke="#1c2a33" stroke-width="2"/>
  <text x="40" y="44" fill="#62e1c3" font-size="12" font-weight="700" letter-spacing="1.5">FIXED SETTLEMENT REVIEW FLOW · MOZAIK RUNTIME</text>
  <text x="40" y="76" fill="#e3edef" font-size="22" font-weight="800">Three parallel specialists, conditional anomaly checks, then audit review</text>
  <rect x="40" y="104" width="1120" height="60" rx="12" fill="#0d141b" stroke="#225b51"/>
  <text x="600" y="141" text-anchor="middle" fill="#75e4c7" font-size="14" font-weight="700">Validated case input · stored in local SQLite · queued in the in-process runtime</text>
  <path d="M600 164 V188 M178 188 H1022 M178 188 V205 M457 188 V205 M743 188 V205 M1022 188 V205" fill="none" stroke="#385a67" stroke-width="2"/>
  <rect x="48" y="205" width="260" height="105" rx="12" fill="#0d141b" stroke="#62e1c3"/>
  <text x="68" y="237" fill="#75e4c7" font-size="16" font-weight="800">Terms specialist</text>
  <text x="68" y="266" fill="#c7d3d6" font-size="13">Invoice, identifiers, tax, fee terms</text>
  <text x="68" y="289" fill="#81949a" font-size="12">Writes findings to case state</text>
  <rect x="327" y="205" width="260" height="105" rx="12" fill="#0d141b" stroke="#10b981"/>
  <text x="347" y="237" fill="#34d399" font-size="16" font-weight="800">FX specialist</text>
  <text x="347" y="266" fill="#c7d3d6" font-size="13">Reference rates, conversion, spread</text>
  <text x="347" y="289" fill="#81949a" font-size="12">Writes findings to case state</text>
  <rect x="606" y="205" width="260" height="105" rx="12" fill="#0d141b" stroke="#f59e0b"/>
  <text x="626" y="237" fill="#fbbf24" font-size="16" font-weight="800">Wire specialist</text>
  <text x="626" y="266" fill="#c7d3d6" font-size="13">Wire parsing, fees, matching</text>
  <text x="626" y="289" fill="#81949a" font-size="12">Writes findings to case state</text>
  <rect x="885" y="205" width="260" height="105" rx="12" fill="#0d141b" stroke="#8b5cf6"/>
  <text x="905" y="237" fill="#a78bfa" font-size="16" font-weight="800">Anomaly specialist</text>
  <text x="905" y="266" fill="#c7d3d6" font-size="13">Duplicate and account-change checks</text>
  <text x="905" y="289" fill="#81949a" font-size="12">Runs only for configured triggers</text>
  <path d="M178 310 V340 H600 M457 310 V340 M743 310 V340 M1022 310 V340 H600 V360" fill="none" stroke="#385a67" stroke-width="2"/>
  <rect x="180" y="360" width="840" height="74" rx="14" fill="#0d2725" stroke="#225b51" stroke-width="1.5"/>
  <text x="600" y="391" text-anchor="middle" fill="#e3edef" font-size="15" font-weight="800">Auditor starts after the expected specialist roles complete</text>
  <text x="600" y="416" text-anchor="middle" fill="#75e4c7" font-size="12">Reconciliation · SourceRef structure check · verdict finalization</text>
  <path d="M600 434 V457" fill="none" stroke="#385a67" stroke-width="2"/>
  <rect x="180" y="457" width="840" height="70" rx="14" fill="#2c2111" stroke="#f0c77f"/>
  <text x="600" y="487" text-anchor="middle" fill="#f0c77f" font-size="15" font-weight="800">Configured human-review breakpoint</text>
  <text x="600" y="510" text-anchor="middle" fill="#c7d3d6" font-size="12">Operator can approve, reject with a note, or stop · no payment or bank action is sent</text>
  <text x="600" y="551" text-anchor="middle" fill="#81949a" font-size="11">Specialists run concurrently within one case; cases in a submitted batch are serialized.</text>
