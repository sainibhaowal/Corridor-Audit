<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="CorridorAudit Banner">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060A14"/>
      <stop offset="50%" stop-color="#0B1325"/>
      <stop offset="100%" stop-color="#091B2B"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="cyanFlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="55%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="emeraldFlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="55%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#6EE7B7"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F192E" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#091121" stop-opacity="0.96"/>
    </linearGradient>
    <radialGradient id="topGlow" cx="18%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#060A14" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Outer Rounded Canvas -->
  <rect x="2" y="2" width="1196" height="336" rx="22" fill="url(#bannerBg)" stroke="#1E293B" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="336" rx="22" fill="url(#topGlow)"/>

  <!-- Subtle Hairline Grid -->
  <g stroke="#16223A" stroke-width="1" opacity="0.7">
    <line x1="0" y1="85" x2="1200" y2="85"/>
    <line x1="0" y1="170" x2="1200" y2="170"/>
    <line x1="0" y1="255" x2="1200" y2="255"/>
    <line x1="760" y1="0" x2="760" y2="340"/>
    <line x1="980" y1="0" x2="980" y2="340"/>
  </g>

  <!-- Signature Interlocking Ribbon Logo Mark (left) -->
  <g transform="translate(46, 74) scale(0.75)">
    <rect x="10" y="10" width="236" height="236" rx="54" fill="#070C18" stroke="#334155" stroke-width="2.5"/>
    <path d="M56 106 C56 72, 82 54, 118 54 L180 54 C190 54, 198 62, 198 72 C198 82, 190 90, 180 90 L120 90 C102 90, 92 98, 92 114 L92 118 L56 118 Z" fill="url(#cyanFlow)"/>
    <path d="M200 150 C200 184, 174 202, 138 202 L76 202 C66 202, 58 194, 58 184 C58 174, 66 166, 76 166 L136 166 C154 166, 164 158, 164 142 L164 138 L200 138 Z" fill="url(#emeraldFlow)"/>
    <rect x="97" y="97" width="62" height="62" rx="16" transform="rotate(45 128 128)" fill="#080E1C" stroke="#E2E8F0" stroke-opacity="0.25" stroke-width="2.5"/>
    <path d="M112 130 L123 141 L143 121" fill="none" stroke="#6EE7B7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="180" cy="72" r="5" fill="#E0F2FE"/>
    <circle cx="76" cy="184" r="5" fill="#D1FAE5"/>
  </g>

  <!-- Brand Title & Subtitle (sized cleanly within x=258..768 so zero card overlap) -->
  <text x="258" y="136" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="#F8FAFC" letter-spacing="-1.2">
    Corridor<tspan fill="url(#accentGrad)">Audit</tspan>
  </text>

  <text x="260" y="175" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" font-size="17" font-weight="500" fill="#CBD5E1">
    Cross-Border Settlement, FX Spread &amp; Hidden-Fee Forensics
  </text>

  <text x="260" y="205" font-family="Segoe UI, Inter, system-ui, -apple-system, sans-serif" font-size="14" fill="#94A3B8">
    Bank SWIFT Wires · Freelancer Platform Payouts · Fintech Settlements
  </text>

  <!-- Feature Badges -->
  <g transform="translate(260, 234)" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="13" font-weight="600">
    <rect x="0" y="0" width="146" height="32" rx="16" fill="#0F2942" stroke="#38BDF8" stroke-opacity="0.45"/>
    <text x="73" y="20.5" text-anchor="middle" fill="#7DD3FC">@mozaik-ai/core</text>

    <rect x="158" y="0" width="142" height="32" rx="16" fill="#0D2B27" stroke="#10B981" stroke-opacity="0.45"/>
    <text x="229" y="20.5" text-anchor="middle" fill="#6EE7B7">Parallel Agents</text>

    <rect x="312" y="0" width="146" height="32" rx="16" fill="#172036" stroke="#64748B" stroke-opacity="0.45"/>
    <text x="385" y="20.5" text-anchor="middle" fill="#E2E8F0">ECB Mid-Market</text>
  </g>

  <!-- Right Side: Live Multi-Agent Flow Card -->
  <g transform="translate(804, 48)">
    <rect x="0" y="0" width="352" height="244" rx="16" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1.5"/>
    <text x="20" y="32" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#64748B" letter-spacing="1.2">
      PARALLEL AGENT TOPOLOGY
    </text>

    <rect x="20" y="50" width="144" height="38" rx="8" fill="#0F1D36" stroke="#38BDF8" stroke-opacity="0.5"/>
    <circle cx="36" cy="69" r="4" fill="#38BDF8"/>
    <text x="48" y="73.5" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="600" fill="#E0F2FE">TermsAgent</text>

    <rect x="20" y="98" width="144" height="38" rx="8" fill="#0F1D36" stroke="#38BDF8" stroke-opacity="0.5"/>
    <circle cx="36" cy="117" r="4" fill="#38BDF8"/>
    <text x="48" y="121.5" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="600" fill="#E0F2FE">FxBenchmark</text>

    <rect x="20" y="146" width="144" height="38" rx="8" fill="#0F1D36" stroke="#38BDF8" stroke-opacity="0.5"/>
    <circle cx="36" cy="165" r="4" fill="#38BDF8"/>
    <text x="48" y="169.5" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="600" fill="#E0F2FE">WireDetective</text>

    <path d="M164 69 H188 V117 M164 117 H198 M164 165 H188 V117" fill="none" stroke="#475569" stroke-width="2"/>
    <polygon points="196,112 206,117 196,122" fill="#10B981"/>

    <rect x="206" y="76" width="126" height="82" rx="10" fill="#0B2922" stroke="#10B981" stroke-width="1.5"/>
    <text x="269" y="106" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#6EE7B7">AuditorAgent</text>
    <text x="269" y="126" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="11" fill="#A7F3D0">Cent-Proof Check</text>
    <text x="269" y="144" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="11" fill="#34D399">+ Breakpoint Gate</text>

    <rect x="20" y="198" width="312" height="30" rx="6" fill="#09101E" stroke="#1E293B"/>
    <text x="176" y="217" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#34D399">
      ✓ Variance: $0.00  ·  [INV] [MT103] [ECB]
    </text>
  </g>
</svg>
