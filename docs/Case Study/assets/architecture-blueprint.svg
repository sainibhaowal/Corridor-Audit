<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 720" width="1320" height="720" role="img" aria-labelledby="title description" font-family="Inter, Segoe UI, system-ui, sans-serif">
  <title id="title">CorridorAudit current local-preview architecture</title>
  <desc id="description">Supported input adapters flow through local SQLite storage and parsing into a Mozaik agent workflow, then an operator review gate and local reports. Deployment limitations are listed at the bottom.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080d12"/><stop offset="1" stop-color="#101820"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0d2725"/><stop offset="1" stop-color="#12231f"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#62e1c3"/></marker>
    <style>
      .label{fill:#e3edef;font-size:15px;font-weight:700}.detail{fill:#aab9bd;font-size:12px}.muted{fill:#81949a;font-size:11px}.stage{fill:#75e4c7;font-size:12px;font-weight:800;letter-spacing:1.5px}.line{stroke:#62e1c3;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1320" height="720" rx="20" fill="url(#bg)" stroke="#26343a" stroke-width="2"/>
  <text x="36" y="43" fill="#62e1c3" font-size="12" font-weight="800" letter-spacing="1.8">CORRIDORAUDIT · IMPLEMENTED FLOW</text>
  <text x="36" y="75" fill="#f2f5f6" font-size="24" font-weight="800">Local settlement review workbench</text>
  <text x="36" y="99" class="muted">Next.js · TypeScript · SQLite · Mozaik · human review</text>

  <rect x="28" y="128" width="258" height="444" rx="15" fill="#0d141b" stroke="#2c4148"/>
  <text x="48" y="160" class="stage">1 · INPUT ADAPTERS</text>
  <rect x="46" y="179" width="222" height="66" rx="10" fill="#080d12" stroke="#32454d"/>
  <text x="61" y="203" class="label">Manual upload</text><text x="61" y="225" class="detail">CSV · MT103 · camt.053 · PDF text · JSON</text>
  <rect x="46" y="257" width="222" height="66" rx="10" fill="#080d12" stroke="#32454d"/>
  <text x="61" y="281" class="label">Inbound JSON</text><text x="61" y="303" class="detail">Webhook + email-adapter payloads</text>
  <rect x="46" y="335" width="222" height="66" rx="10" fill="#080d12" stroke="#32454d"/>
  <text x="61" y="359" class="label">Local hot folder</text><text x="61" y="381" class="detail">Watches configured local directory</text>
  <rect x="46" y="413" width="222" height="82" rx="10" fill="#080d12" stroke="#32454d"/>
  <text x="61" y="437" class="label">Integration sync</text><text x="61" y="459" class="detail">Provider polling is limited;</text><text x="61" y="478" class="detail">some catalog entries are generic</text>
  <text x="48" y="535" class="muted">No SFTP client or hosted mailbox</text>

  <rect x="316" y="128" width="270" height="444" rx="15" fill="#0d141b" stroke="#2c4148"/>
  <text x="336" y="160" class="stage">2 · STORAGE &amp; NORMALIZATION</text>
  <rect x="334" y="184" width="234" height="118" rx="12" fill="url(#card)" stroke="#225b51"/>
  <text x="451" y="213" text-anchor="middle" class="label">Local SQLite</text>
  <text x="351" y="239" class="detail">Raw content + SHA-256 digest</text>
  <text x="351" y="260" class="detail">Cases + completed verdicts</text>
  <text x="351" y="281" class="muted">Raw content is plaintext; digest is not immutability</text>
  <path d="M451 309v37" class="line"/>
  <rect x="334" y="354" width="234" height="105" rx="12" fill="#080d12" stroke="#32454d"/>
  <text x="451" y="383" text-anchor="middle" class="label">Parser &amp; normalizer</text>
  <text x="351" y="408" class="detail">Maps supported inputs to case records</text>
  <text x="351" y="431" class="muted">Parser coverage is format-specific</text>
  <text x="336" y="535" class="muted">AES-256-GCM applies to credentials, not raw payloads</text>

  <rect x="616" y="128" width="414" height="444" rx="15" fill="#0d141b" stroke="#225b51" stroke-width="1.5"/>
  <text x="636" y="160" class="stage">3 · MOZAIK CASE WORKFLOW</text>
  <text x="823" y="188" text-anchor="middle" class="muted">Specialists run concurrently within a case</text>
  <rect x="636" y="207" width="176" height="60" rx="10" fill="#101820" stroke="#62e1c3"/>
  <text x="724" y="232" text-anchor="middle" class="label">TermsAgent</text><text x="724" y="251" text-anchor="middle" class="muted">Invoice / fee terms</text>
  <rect x="834" y="207" width="176" height="60" rx="10" fill="#101820" stroke="#62e1c3"/>
  <text x="922" y="232" text-anchor="middle" class="label">FxBenchmarkAgent</text><text x="922" y="251" text-anchor="middle" class="muted">Rate / FX difference</text>
  <rect x="636" y="283" width="176" height="60" rx="10" fill="#101820" stroke="#62e1c3"/>
  <text x="724" y="308" text-anchor="middle" class="label">WireDetectiveAgent</text><text x="724" y="327" text-anchor="middle" class="muted">Fees / matching</text>
  <rect x="834" y="283" width="176" height="60" rx="10" fill="#101820" stroke="#a78bfa"/>
  <text x="922" y="308" text-anchor="middle" class="label">AnomalyAgent</text><text x="922" y="327" text-anchor="middle" class="muted">Conditional checks</text>
  <path d="M724 268v29m198-29v29m-198 16v26m198-26v26" stroke="#32454d" stroke-width="1.5" fill="none"/>
  <rect x="636" y="374" width="374" height="74" rx="12" fill="url(#card)" stroke="#225b51"/>
  <text x="823" y="405" text-anchor="middle" class="label">AuditorAgent · expected-role barrier</text>
  <text x="823" y="428" text-anchor="middle" class="detail">Runs after required specialists report completion</text>
  <text x="636" y="490" class="detail">Cases are serialized by the in-process orchestrator.</text>
  <text x="636" y="516" class="muted">Queue, agent activity, and pending approvals are in memory.</text>

  <rect x="1060" y="128" width="232" height="444" rx="15" fill="#0d141b" stroke="#2c4148"/>
  <text x="1080" y="160" class="stage">4 · REVIEW &amp; OUTPUT</text>
  <rect x="1078" y="192" width="196" height="122" rx="12" fill="#2c2111" stroke="#f0c77f"/>
  <text x="1176" y="222" text-anchor="middle" class="label">Operator gate</text>
  <text x="1094" y="248" class="detail">Approve · steer · stop</text>
  <text x="1094" y="271" class="detail">No payment execution</text>
  <text x="1094" y="293" class="muted">Decision stays with reviewer</text>
  <path d="M1176 321v40" class="line"/>
  <rect x="1078" y="370" width="196" height="92" rx="12" fill="#101820" stroke="#32454d"/>
  <text x="1176" y="400" text-anchor="middle" class="label">Verdict &amp; report</text>
  <text x="1094" y="426" class="detail">UI · text/JSON · history</text>
  <text x="1094" y="448" class="muted">Review source records before use</text>
  <text x="1080" y="516" class="muted">No authenticated user / tenant controls</text>

  <path d="M286 350h24m276 0h24m414 0h24" class="line"/>
  <rect x="28" y="598" width="1264" height="88" rx="13" fill="#151b1f" stroke="#3a4248"/>
  <text x="52" y="628" fill="#f0c77f" font-size="13" font-weight="800">LOCAL PREVIEW · NOT A PRODUCTION FINANCIAL SERVICE</text>
  <text x="52" y="653" class="detail">No authentication/tenant isolation, durable distributed queue, complete provider coverage, encrypted raw-payload storage, or production backup/monitoring.</text>
  <text x="52" y="674" class="muted">Use synthetic or public data only. SourceRef structure checks do not independently authenticate evidence or figures.</text>
</svg>
